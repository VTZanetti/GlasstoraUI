# Publishes to npm when a commit lands on main carrying a version the registry
# does not have yet.
#
#   1. bump the version in package.json inside the pull request
#   2. merge it
#   3. this sees the version is new, verifies it, publishes, and tags the commit
#
# The manifest is what declares a release, so a merge that leaves the version
# alone stops at the gate and costs nothing. The checks are repeated here rather
# than taken from ci.yml, which runs on the same event but as a separate job:
# nothing should reach the registry unverified from inside the job publishing it.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Two merges close together would otherwise both look at the registry before
# either had published, and race for the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Kept apart from the release itself so the ordinary merge, which is every
  # merge that is not a release, pays for a checkout and one registry query.
  gate:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Compare the manifest against the registry
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "glasstora@$version" version >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "glasstora@$version is already on the registry. Nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "glasstora@$version is not on the registry. Releasing it."
          fi

  release:
    needs: gate
    if: needs.gate.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Write only to record the tag, and only once the publish has succeeded.
      contents: write
      # Required to mint the OIDC token the trusted publisher authenticates
      # with, and the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # registry-url is what tells npm which registry to run the OIDC exchange
      # against, so it has to stay.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          # npm's own guidance for a trusted publisher: never cache in a release
          # build, so what gets published came from a clean resolve.
          package-manager-cache: false

      # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc as part of
      # honouring registry-url. With no token set the line is empty, and npm
      # reading it as "auth is already configured" is what stops it from ever
      # running the OIDC exchange: actions/setup-node#1551. v7 dropped the
      # placeholder that used to make this certain, so this only removes what is
      # left of the hazard, and prints the file so a future failure names itself
      # instead of arriving as a bare 404.
      - name: Leave the OIDC exchange with nothing to trip over
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          [ -f "$npmrc" ] && sed -i '/_authToken/d' "$npmrc"
          echo "--- $npmrc ---"
          cat "$npmrc" 2>/dev/null || echo "(no .npmrc)"

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run check:dist
      - run: npx publint

      - name: Show what is about to be published
        run: npm pack --dry-run

      # The exchange needs npm 11.5.1 or newer, and its absence looks from the
      # error exactly like a credential problem. Printed so the next failure
      # says which of the two it is.
      - name: Show the npm version
        run: npm --version

      # Authenticated by the trusted publisher on npm, through the OIDC token
      # the id-token permission above mints. There is no secret to hold.
      #
      # Built and checked above, so the prepublishOnly script would only repeat
      # all of it. check:dist immediately before this is what proves dist is real.
      - run: npm publish --provenance --access public --ignore-scripts

      # A tag is the only thing in the repository itself that says which commit
      # became which version. The gate proved this version was absent from the
      # registry, so a tag of that name can only be marking an attempt that
      # never shipped, and moving it here corrects the record rather than
      # losing anything.
      - name: Record what shipped
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "v$VERSION" -m "glasstora $VERSION"
          git push -f origin "v$VERSION"
